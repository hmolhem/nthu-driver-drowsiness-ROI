# Improved ResNet50 Configuration
# Features: AdamW, Cosine Scheduler, Label Smoothing, Stronger Augmentation

model:
  name: "resnet50_improved"
  architecture: "resnet50"
  pretrained: true
  num_classes: 2
  freeze_backbone: false

data:
  data_root: "datasets"
  train_csv: "data/splits/train.csv"
  val_csv: "data/splits/val.csv"
  test_csv: "data/splits/test.csv"
  image_size: 224
  batch_size: 32
  num_workers: 0  # Windows compatibility
  pin_memory: true

augmentation:
  enabled: true
  # Stronger geometric augs
  crop_scale: [0.6, 1.0]  # RandomResizedCrop scale
  horizontal_flip: 0.5
  rotation_degrees: 15
  
  # Color/Noise augs
  color_jitter: 0.3
  hue: 0.1
  gaussian_noise: true
  noise_std: 0.05
  
  random_affine:
    translate: [0.1, 0.1]
    scale: [0.9, 1.1]

training:
  epochs: 50
  optimizer: "adamw"
  learning_rate: 0.0005  # Slightly higher initial LR for cosine
  weight_decay: 0.01     # Higher weight decay for AdamW
  
  lr_scheduler:
    type: "cosine"
    min_lr: 0.000001
  
  loss:
    type: "cross_entropy"
    label_smoothing: 0.1
  
  early_stopping:
    enabled: true
    patience: 15
    monitor: "val_macro_f1"
    mode: "max"
  
  gradient_clipping:
    enabled: true
    max_norm: 1.0

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - macro_f1
    - confusion_matrix
  
  primary_metric: "macro_f1"

logging:
  experiment_name: "improved_resnet50"
  log_dir: "runs"
  save_dir: "checkpoints"
  log_interval: 10
  save_best_only: true
  save_last: true

seed: 42
device: "cuda"
