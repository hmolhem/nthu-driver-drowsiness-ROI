# MobileNetV3-Small CPU Configuration (Regularized)
# Optimized for CPU speed with strong regularization to prevent overfitting

model:
  name: "mobilenet_v3_small_cpu_reg"
  architecture: "mobilenet_v3_small"
  pretrained: true
  num_classes: 2
  freeze_backbone: false
  dropout: 0.5                  # Increased from 0.3 to 0.5 (max standard dropout)

data:
  data_root: "datasets"
  train_csv: "data/splits/train.csv"
  val_csv: "data/splits/val.csv"
  test_csv: "data/splits/test.csv"
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true

augmentation:
  enabled: true
  # Stronger augmentation parameters
  horizontal_flip: 0.5
  rotation_degrees: 30          # Increased from 15
  color_jitter: 0.4             # Increased from default 0.3 (in code)
  hue: 0.1
  translate: [0.1, 0.1]
  scale: [0.8, 1.2]             # Wider range (was 0.85-1.15)
  blur_enabled: true            # New: Enable Gaussian Blur
  blur_kernel: 3
  blur_sigma: [0.1, 2.0]

training:
  epochs: 20
  optimizer: "adamw"
  learning_rate: 0.001
  weight_decay: 0.05            # Increased from 0.01 to 0.05 (Stronger L2)
  compile: false
  amp:
    enabled: false
  lr_scheduler:
    type: "reduce_on_plateau"
    mode: "max"
    factor: 0.5
    patience: 3
    min_lr: 0.000001
  loss:
    type: "weighted_cross_entropy"
    use_class_weights: true
  early_stopping:
    enabled: true
    patience: 5
    monitor: "val_macro_f1"
    mode: "max"
    min_delta: 0.0001
  gradient_clipping:
    enabled: true
    max_norm: 1.0

logging:
  experiment_name: "mobilenet_v3_small_cpu_reg"
  log_dir: "runs"
  save_dir: "checkpoints"
  log_interval: 0
  save_best_only: true
  save_last: true

seed: 42
device: "cpu"
