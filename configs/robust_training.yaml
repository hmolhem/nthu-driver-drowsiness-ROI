# Robust configuration to prevent overfitting
seed: 42
device: cuda

data:
  data_root: datasets
  train_csv: data/splits/train.csv
  val_csv: data/splits/val.csv
  test_csv: data/splits/test.csv
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

model:
  architecture: mobilenet_v3_large
  num_classes: 2
  pretrained: true
  freeze_backbone: true  # FREEZE backbone for first few epochs to stabilize features
  dropout: 0.5           # INCREASED from 0.2 to 0.5

training:
  epochs: 30             # Increased epochs since we have early stopping
  optimizer: adamw
  learning_rate: 0.0005  # Lower LR for fine-tuning
  weight_decay: 0.05     # INCREASED from 0.01 to 0.05 (Stronger L2 regularization)
  
  loss:
    type: cross_entropy
    label_smoothing: 0.2 # INCREASED from 0.1 to 0.2
  
  lr_scheduler:
    type: cosine
    min_lr: 1.0e-6
  
  early_stopping:
    enabled: true
    patience: 8          # Increased patience to allow recovery
    monitor: val_f1_macro
  
  amp:
    enabled: true
  
  compile: false
  
  gradient_clipping:
    enabled: true
    max_norm: 1.0

augmentation:
  enabled: true
  # Stronger geometric transforms
  crop_scale: [0.6, 1.0]      # More aggressive cropping (was 0.8)
  horizontal_flip: 0.5
  rotation_degrees: 30        # Increased from 10
  translate: [0.2, 0.2]       # Increased translation
  scale: [0.7, 1.3]           # Wider scale range
  
  # Stronger color transforms to hide identity
  color_jitter: 0.5           # Increased from 0.2
  grayscale_prob: 0.2         # NEW: Randomly convert to grayscale
  
  # Texture masking
  gaussian_noise: true        # Enabled
  noise_std: 0.05
  blur_enabled: true          # Enabled
  blur_kernel: 3
  blur_sigma: [0.1, 2.0]

logging:
  save_dir: checkpoints
  experiment_name: robust_mobilenet
  log_interval: 10
