# Configuration for the lightweight SimpleCNN baseline
seed: 42
device: cuda

data:
  data_root: datasets
  train_csv: data/splits/train.csv
  val_csv: data/splits/val.csv
  test_csv: data/splits/test.csv
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

model:
  architecture: simple_cnn
  num_classes: 2
  dropout: 0.5           # Matches the notebook

training:
  epochs: 20             # Notebook used 10, let's allow a bit more but keep it short
  optimizer: adamw
  learning_rate: 0.001   # Standard starting rate
  weight_decay: 0.01     # Standard regularization
  
  loss:
    type: cross_entropy
    label_smoothing: 0.1
  
  lr_scheduler:
    type: cosine
    min_lr: 1.0e-6
  
  early_stopping:
    enabled: true
    patience: 5
    monitor: val_f1_macro
  
  amp:
    enabled: true
  
  compile: false
  
  gradient_clipping:
    enabled: true
    max_norm: 1.0

augmentation:
  enabled: true
  # Standard geometric transforms
  crop_scale: [0.8, 1.0]
  horizontal_flip: 0.5
  rotation_degrees: 15
  translate: [0.1, 0.1]
  scale: [0.9, 1.1]
  
  # Color transforms
  color_jitter: 0.2
  grayscale_prob: 0.1
  
  # Texture masking
  gaussian_noise: true
  noise_std: 0.05
  blur_enabled: true
  blur_kernel: 3
  blur_sigma: [0.1, 2.0]

logging:
  save_dir: checkpoints
  experiment_name: baseline_simple_cnn
  log_interval: 10
