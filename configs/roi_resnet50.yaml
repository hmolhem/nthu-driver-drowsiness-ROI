# ROI-Gated ResNet50 Configuration

model:
  name: "roi_resnet50"
  architecture: "resnet50"
  pretrained: true
  num_classes: 2
  freeze_backbone: false
  dropout: 0.5
  
  roi_config:
    enabled: true
    use_attention: true
    
  multi_task:
    enabled: false  # Set to true when segmentation labels are ready
    segmentation_loss_weight: 0.3

data:
  data_root: "datasets"
  train_csv: "data/splits/train.csv"
  val_csv: "data/splits/val.csv"
  test_csv: "data/splits/test.csv"
  image_size: 224
  batch_size: 16  # Reduced batch size for ROI model overhead
  num_workers: 2
  pin_memory: true

augmentation:
  enabled: true
  horizontal_flip: 0.5
  rotation_degrees: 15
  color_jitter: 0.2
  scale: [0.9, 1.1]

training:
  epochs: 20
  optimizer: "adamw"
  learning_rate: 0.0001
  weight_decay: 0.01
  compile: false
  amp:
    enabled: false
  lr_scheduler:
    type: "reduce_on_plateau"
    mode: "max"
    factor: 0.5
    patience: 3
    min_lr: 0.000001
  loss:
    type: "weighted_cross_entropy"
    use_class_weights: true
  early_stopping:
    enabled: true
    patience: 5
    monitor: "val_macro_f1"
    mode: "max"
    min_delta: 0.0001

logging:
  experiment_name: "roi_resnet50_v1"
  log_dir: "runs"
  save_dir: "checkpoints"
  log_interval: 10
  save_best_only: true
  save_last: true

seed: 42
device: "cuda"  # Default to CUDA, fallback to CPU handled in script
